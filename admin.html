<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Administración del Evento</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
}

header p {
    margin: 0;
}

.contenedor {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px 50px;
}

.login {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    max-width: 450px;
    margin: 50px auto;
}

.campo {
    margin-bottom: 18px;
}

.campo label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.campo input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.boton {
    width: 100%;
    background: #111;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.boton:hover {
    background: #333;
}

.error {
    background: #ffe5e5;
    color: #b00000;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.dashboard {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.tarjeta {
    background: white;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.tarjeta h3 {
    margin: 0 0 10px;
    font-size: 16px;
}

.numero {
    font-size: 35px;
    font-weight: bold;
}

.tabla-contenedor {
    background: white;
    border-radius: 15px;
    padding: 20px;
    overflow-x: auto;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    vertical-align: top;
}

th {
    background: #f5f5f5;
}

.estado {
    font-weight: bold;
}

.detalle-asientos {
    line-height: 1.7;
}

.cantidad-asientos {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.oculto {
    display: none;
}

.boton-salir {
    background: #c0392b;
    width: auto;
    padding: 10px 20px;
}

.boton-salir:hover {
    background: #a93226;
}

.barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.cargando {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width:600px) {

    .barra-superior {
        flex-direction: column;
        align-items: stretch;
    }

    .boton-salir {
        width: 100%;
    }

    th,
    td {
        font-size: 14px;
        padding: 10px;
    }

}

</style>

</head>

<body>

<header>

<h1>CONTROL ADMINISTRATIVO</h1>

<p>Concierto Los Inquietos de Olancho</p>

</header>


<div class="contenedor">


<!-- ==============================
     LOGIN
============================== -->

<div id="login"
     class="login">

<h2>Acceso administrativo</h2>

<p>
Ingresa con tu usuario administrador.
</p>

<div id="errorLogin"></div>

<div class="campo">

<label>
Correo electrónico
</label>

<input
type="email"
id="email"
placeholder="Correo electrónico">

</div>

<div class="campo">

<label>
Contraseña
</label>

<input
type="password"
id="password"
placeholder="Contraseña">

</div>

<button
class="boton"
onclick="iniciarSesion()">

INGRESAR

</button>

</div>


<!-- ==============================
     PANEL
============================== -->

<div id="panel"
     class="oculto">


<div class="barra-superior">

<div>

<h2>
Dashboard del evento
</h2>

<div id="usuario"></div>

</div>

<button
class="boton boton-salir"
onclick="cerrarSesion()">

CERRAR SESIÓN

</button>

</div>


<div class="dashboard">


<div class="tarjeta">

<h3>
TOTAL ASIENTOS
</h3>

<div
class="numero"
id="totalAsientos">
0
</div>

</div>


<div class="tarjeta">

<h3>
DISPONIBLES
</h3>

<div
class="numero"
id="disponibles">
0
</div>

</div>


<div class="tarjeta">

<h3>
RESERVADOS
</h3>

<div
class="numero"
id="reservados">
0
</div>

</div>


<div class="tarjeta">

<h3>
INGRESADOS
</h3>

<div
class="numero"
id="ingresados">
0
</div>

</div>


</div>


<div class="tabla-contenedor">

<h2>
Reservas
</h2>

<div
id="estadoCarga"
class="cargando">

Cargando reservas...

</div>

<table id="tablaCompleta"
       style="display:none;">

<thead>

<tr>

<th>
Reserva
</th>

<th>
Cliente
</th>

<th>
Teléfono
</th>

<th>
Asientos
</th>

<th>
Estado
</th>

</tr>

</thead>

<tbody id="tablaReservas"></tbody>

</table>

</div>


</div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://ysismkibffhzouxacaxv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_zDHgY0bQDhtD60u8B3xQlA_F8w0Lv5L";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   LOGIN
========================================== */

async function iniciarSesion() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("errorLogin");

    error.innerHTML = "";

    if (!email || !password) {

        error.innerHTML = `
            <div class="error">
                Completa correo y contraseña.
            </div>
        `;

        return;
    }


    const resultado =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (resultado.error) {

        error.innerHTML = `
            <div class="error">
                ${resultado.error.message}
            </div>
        `;

        return;
    }


    await mostrarPanel();
}


/* ==========================================
   MOSTRAR PANEL
========================================== */

async function mostrarPanel() {

    document.getElementById("login")
        .classList.add("oculto");

    document.getElementById("panel")
        .classList.remove("oculto");


    const usuario =
        await db.auth.getUser();


    if (usuario.data.user) {

        document.getElementById("usuario")
            .textContent =
            usuario.data.user.email;
    }


    await cargarDashboard();
}


/* ==========================================
   DASHBOARD
========================================== */

async function cargarDashboard() {

    try {

        document.getElementById("estadoCarga")
            .textContent =
            "Cargando reservas...";


        /* ==========================================
           ASIENTOS
        ========================================== */

        const resultadoAsientos =
            await db
            .from("asientos")
            .select("*");


        if (resultadoAsientos.error)
            throw resultadoAsientos.error;


        const asientos =
            resultadoAsientos.data;


        const total =
            asientos.length;


        const disponibles =
            asientos.filter(
                asiento =>
                    asiento.estado === "disponible"
            ).length;


        const reservados =
            asientos.filter(
                asiento =>
                    asiento.estado === "reservado" ||
                    asiento.estado === "vendido"
            ).length;


        document.getElementById(
            "totalAsientos"
        ).textContent = total;


        document.getElementById(
            "disponibles"
        ).textContent = disponibles;


        document.getElementById(
            "reservados"
        ).textContent = reservados;


        /* ==========================================
           BOLETOS / INGRESADOS
        ========================================== */

        const resultadoBoletos =
            await db
            .from("boletos")
            .select("id, estado");


        if (resultadoBoletos.error)
            throw resultadoBoletos.error;


        const boletos =
            resultadoBoletos.data;


        const ingresados =
            boletos.filter(
                boleto =>
                    boleto.estado === "utilizado"
            ).length;


        document.getElementById(
            "ingresados"
        ).textContent = ingresados;


        /* ==========================================
           RESERVAS
        ========================================== */

        const resultadoReservas =
            await db
            .from("reservas")
            .select("*")
            .order(
                "id",
                { ascending: false }
            );


        if (resultadoReservas.error)
            throw resultadoReservas.error;


        const reservas =
            resultadoReservas.data;


        /* ==========================================
           RELACIÓN RESERVA - ASIENTOS
        ========================================== */

        const resultadoReservaAsientos =
            await db
            .from("reserva_asientos")
            .select("*");


        if (resultadoReservaAsientos.error)
            throw resultadoReservaAsientos.error;


        const reservaAsientos =
            resultadoReservaAsientos.data;


        /* ==========================================
           MESAS
        ========================================== */

        const resultadoMesas =
            await db
            .from("mesas")
            .select("*");


        if (resultadoMesas.error)
            throw resultadoMesas.error;


        const mesas =
            resultadoMesas.data;


        /* ==========================================
           CONSTRUIR TABLA
        ========================================== */

        const tabla =
            document.getElementById(
                "tablaReservas"
            );


        tabla.innerHTML = "";


        reservas.forEach(reserva => {

            const fila =
                document.createElement("tr");


            /*
            Buscar todos los registros de
            reserva_asientos pertenecientes
            a esta reserva.
            */

            const relaciones =
                reservaAsientos.filter(
                    relacion =>
                        Number(relacion.reserva_id) ===
                        Number(reserva.id)
                );


            /*
            Construir detalle:
            Mesa X — Asiento X
            */

            const detalles = [];


            relaciones.forEach(relacion => {

                const asiento =
                    asientos.find(
                        item =>
                            Number(item.id) ===
                            Number(relacion.asiento_id)
                    );


                if (!asiento)
                    return;


                const mesa =
                    mesas.find(
                        item =>
                            Number(item.id) ===
                            Number(asiento.mesa_id)
                    );


                if (!mesa)
                    return;


                detalles.push(
                    `Mesa ${mesa.numero} — Asiento ${asiento.numero}`
                );

            });


            /*
            Construir contenido de columna Asientos
            */

            let textoAsientos = "";


            if (detalles.length === 0) {

                textoAsientos =
                    `<span>Sin asientos</span>`;

            } else {

                textoAsientos = `

                    <span class="cantidad-asientos">
                        ${detalles.length}
                        ${detalles.length === 1
                            ? "asiento"
                            : "asientos"}
                    </span>

                    <div class="detalle-asientos">

                        ${detalles
                            .map(
                                detalle =>
                                    `${detalle}<br>`
                            )
                            .join("")}

                    </div>

                `;

            }


            /*
            Crear fila
            */

            fila.innerHTML = `

                <td>
                    ${reserva.codigo_reserva || reserva.id}
                </td>

                <td>
                    ${reserva.nombre_cliente || ""}
                </td>

                <td>
                    ${reserva.telefono || ""}
                </td>

                <td>
                    ${textoAsientos}
                </td>

                <td class="estado">
                    ${reserva.estado || "Registrada"}
                </td>

            `;


            tabla.appendChild(fila);

        });


        document.getElementById(
            "estadoCarga"
        ).style.display =
        "none";


        document.getElementById(
            "tablaCompleta"
        ).style.display =
        "table";

    }

    catch(error) {

        console.error(
            "Error cargando dashboard:",
            error
        );


        document.getElementById(
            "estadoCarga"
        ).innerHTML = `

            <div class="error">
                No fue posible cargar
                la información del panel.
            </div>

        `;
    }

}


/* ==========================================
   CERRAR SESIÓN
========================================== */

async function cerrarSesion() {

    await db.auth.signOut();

    location.reload();
}


/* ==========================================
   COMPROBAR SESIÓN
========================================== */

async function comprobarSesion() {

    const resultado =
        await db.auth.getSession();


    if (
        resultado.data.session
    ) {

        await mostrarPanel();
    }
}


/* ==========================================
   INICIAR
========================================== */

comprobarSesion();

</script>

</body>

</html>
