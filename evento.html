<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Evento</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 40px 20px;
}

header h1 {
    margin: 0 0 10px;
}

header p {
    margin: 6px;
}

.container {
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 15px 220px;
}

.leyenda {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
    flex-wrap: wrap;
}

.leyenda-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.circulo {
    width: 18px;
    height: 18px;
    border-radius: 50%;
}

.verde { background: #2ecc71; }
.amarillo { background: #f1c40f; }
.rojo { background: #e74c3c; }

.estado {
    text-align: center;
    font-weight: bold;
    margin: 20px;
}

/* MAPA */

.mapa-scroll {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 20px;
    -webkit-overflow-scrolling: touch;
}

.mapa {
    min-width: 1380px;
}

.escenario {
    width: 75%;
    margin: 0 auto 35px;
    background: #111;
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 20px;
}

.mesas {
    display: grid;
    grid-template-columns: repeat(5, 250px);
    gap: 28px;
    justify-content: center;
}

.mesa {
    background: white;
    border-radius: 15px;
    padding: 18px 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    text-align: center;
}

.mesa h3 {
    margin-top: 0;
}

.distribucion-mesa {
    display: grid;
    grid-template-columns: 44px 105px 44px;
    grid-template-rows: repeat(5, 48px);
    gap: 7px 10px;
    justify-content: center;
    align-items: center;
}

.rectangulo-mesa {
    grid-column: 2;
    grid-row: 1 / 6;
    height: 100%;
    background: #111;
    color: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-weight: bold;
}

.asiento {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #2ecc71;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.asiento-izquierda {
    grid-column: 1;
}

.asiento-derecha {
    grid-column: 3;
}

.fila-1 { grid-row: 1; }
.fila-2 { grid-row: 2; }
.fila-3 { grid-row: 3; }
.fila-4 { grid-row: 4; }
.fila-5 { grid-row: 5; }

.asiento.seleccionado {
    background: #f1c40f;
    color: #111;
}

.asiento.reservado {
    background: #e74c3c;
    cursor: not-allowed;
}

.asiento.vendido {
    background: #8e44ad;
    cursor: not-allowed;
}

.asiento.utilizado {
    background: #555;
    cursor: not-allowed;
}

/* RESUMEN */

.resumen {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    box-shadow: 0 -5px 20px rgba(0,0,0,.15);
    padding: 14px;
    text-align: center;
    z-index: 100;
}

#seleccion {
    font-size: 13px;
    max-height: 45px;
    overflow-y: auto;
    margin: 6px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin: 8px;
}

.boton {
    border: none;
    background: #111;
    color: white;
    padding: 13px 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 500;
    overflow-y: auto;
    padding: 20px;
}

.modal-contenido {
    background: white;
    max-width: 520px;
    margin: 30px auto;
    padding: 28px;
    border-radius: 15px;
}

.campo {
    margin-bottom: 16px;
}

.campo label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.campo input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.botones-modal {
    display: flex;
    gap: 10px;
}

.boton-cancelar {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 7px;
}

.boton-confirmar {
    flex: 2;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #111;
    color: white;
}

.resumen-compra {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.7;
    margin-bottom: 20px;
}

.boleto {
    background: #f5f5f5;
    padding: 20px;
    border-radius: 12px;
    margin: 18px 0;
    text-align: center;
}

.qr {
    display: flex;
    justify-content: center;
    margin: 15px auto;
}

.codigo {
    background: #eee;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    margin: 15px 0;
}

.error {
    background: #ffe5e5;
    color: #b00000;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.aviso-scroll {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 15px;
}

@media(max-width:600px) {

    header h1 {
        font-size: 26px;
    }

    .container {
        padding-bottom: 240px;
    }

    /*
    AQUÍ ESTÁ LA CLAVE:
    NO reordenamos las mesas.
    Siguen siendo 5 columnas.
    El usuario desliza horizontalmente.
    */

    .mapa {
        min-width: 1380px;
    }

    .mesas {
        grid-template-columns: repeat(5, 250px);
    }

}

</style>

</head>

<body>

<header>

<h1 id="nombreEvento">
Evento
</h1>

<p id="fechaEvento"></p>

<p id="lugarEvento"></p>

<p id="precioEvento"></p>

</header>

<div class="container">

<div class="leyenda">

<div class="leyenda-item">
<div class="circulo verde"></div>
Disponible
</div>

<div class="leyenda-item">
<div class="circulo amarillo"></div>
Seleccionado
</div>

<div class="leyenda-item">
<div class="circulo rojo"></div>
Reservado
</div>

</div>

<div id="estado"
class="estado">

Cargando evento...

</div>

<div class="aviso-scroll">
En móvil, desliza horizontalmente para recorrer el mapa completo.
</div>

<div class="mapa-scroll">

<div class="mapa">

<div class="escenario">
ESCENARIO
</div>

<div id="mesas"
class="mesas">
</div>

</div>

</div>

</div>

<div class="resumen">

<strong>
Asientos seleccionados:
</strong>

<div id="seleccion">
Ninguno
</div>

<div>
Cantidad:
<strong id="cantidad">
0
</strong>
</div>

<div class="total">
TOTAL:
<span id="total">
L 0.00
</span>
</div>

<button
class="boton"
onclick="abrirFormulario()">

CONTINUAR

</button>

</div>

<div id="modal"
class="modal">

<div id="modalContenido"
class="modal-contenido">

<h2>Datos del comprador</h2>

<div id="resumenModal"
class="resumen-compra">
</div>

<div id="mensajeError"></div>

<div class="campo">

<label>
Nombre completo
</label>

<input
id="nombre"
type="text">

</div>

<div class="campo">

<label>
Teléfono
</label>

<input
id="telefono"
type="tel">

</div>

<div class="campo">

<label>
Correo electrónico
</label>

<input
id="correo"
type="email">

</div>

<div class="botones-modal">

<button
class="boton-cancelar"
onclick="cerrarFormulario()">

Cancelar

</button>

<button
class="boton-confirmar"
onclick="confirmarReserva()">

CONFIRMAR RESERVA

</button>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://ysismkibffhzouxacaxv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zDHgY0bQDhtD60u8B3xQlA_F8w0Lv5L";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let evento = null;
let mesas = [];
let asientos = [];
let seleccionados = [];

function formatoLempiras(valor) {

    return "L " +
    Number(valor).toLocaleString(
        "es-HN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}

function obtenerEventoId() {

    const parametros =
    new URLSearchParams(
        window.location.search
    );

    return Number(
        parametros.get("id")
    );

}

async function cargarEvento() {

    try {

        const eventoId =
        obtenerEventoId();

        if (!eventoId) {

            throw new Error(
                "Evento no válido"
            );

        }

        const resultadoEvento =
        await db
        .from("eventos")
        .select("*")
        .eq("id", eventoId)
        .single();

        if (resultadoEvento.error)
            throw resultadoEvento.error;

        evento =
        resultadoEvento.data;

        document
        .getElementById("nombreEvento")
        .textContent =
        evento.nombre;

        document
        .getElementById("fechaEvento")
        .textContent =
        "📅 " +
        new Date(evento.fecha)
        .toLocaleDateString(
            "es-HN",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

        document
        .getElementById("lugarEvento")
        .textContent =
        "📍 " +
        evento.lugar;

        document
        .getElementById("precioEvento")
        .textContent =
        "🎟️ " +
        formatoLempiras(
            evento.precio_asiento
        ) +
        " por asiento";

        const resultadoMesas =
        await db
        .from("mesas")
        .select("*")
        .eq(
            "evento_id",
            eventoId
        )
        .order("numero");

        if (resultadoMesas.error)
            throw resultadoMesas.error;

        mesas =
        resultadoMesas.data;

        const idsMesas =
        mesas.map(
            mesa =>
            mesa.id
        );

        const resultadoAsientos =
        await db
        .from("asientos")
        .select("*")
        .in(
            "mesa_id",
            idsMesas
        )
        .order("id");

        if (resultadoAsientos.error)
            throw resultadoAsientos.error;

        asientos =
        resultadoAsientos.data;

        mostrarMesas();

        document
        .getElementById("estado")
        .textContent =
        "Selecciona tus asientos";

    }

    catch(error) {

        console.error(error);

        document
        .getElementById("estado")
        .textContent =
        "No fue posible cargar el evento.";

    }

}

function mostrarMesas() {

    const contenedor =
    document.getElementById(
        "mesas"
    );

    contenedor.innerHTML = "";

    mesas.forEach(
        mesa => {

        const mesaDiv =
        document.createElement(
            "div"
        );

        mesaDiv.className =
        "mesa";

        const titulo =
        document.createElement(
            "h3"
        );

        titulo.textContent =
        "MESA " +
        mesa.numero;

        mesaDiv.appendChild(
            titulo
        );

        const distribucion =
        document.createElement(
            "div"
        );

        distribucion.className =
        "distribucion-mesa";

        const rectangulo =
        document.createElement(
            "div"
        );

        rectangulo.className =
        "rectangulo-mesa";

        rectangulo.textContent =
        "MESA " +
        mesa.numero;

        distribucion.appendChild(
            rectangulo
        );

        const asientosMesa =
        asientos
        .filter(
            asiento =>
            Number(asiento.mesa_id) ===
            Number(mesa.id)
        )
        .sort(
            (a,b) =>
            Number(a.numero) -
            Number(b.numero)
        );

        asientosMesa.forEach(
            asiento => {

            const boton =
            document.createElement(
                "button"
            );

            boton.className =
            "asiento";

            boton.textContent =
            asiento.numero;

            if (
                Number(asiento.numero) <= 5
            ) {

                boton.classList.add(
                    "asiento-izquierda"
                );

                boton.classList.add(
                    `fila-${asiento.numero}`
                );

            }

            else {

                boton.classList.add(
                    "asiento-derecha"
                );

                boton.classList.add(
                    `fila-${Number(asiento.numero)-5}`
                );

            }

            actualizarEstadoVisual(
                boton,
                asiento
            );

            boton.onclick =
            () =>
            seleccionarAsiento(
                asiento,
                boton
            );

            distribucion.appendChild(
                boton
            );

        });

        mesaDiv.appendChild(
            distribucion
        );

        contenedor.appendChild(
            mesaDiv
        );

    });

}

function actualizarEstadoVisual(
    boton,
    asiento
) {

    if (
        asiento.estado ===
        "reservado"
    ) {

        boton.classList.add(
            "reservado"
        );

        boton.disabled =
        true;

    }

    else if (
        asiento.estado ===
        "vendido"
    ) {

        boton.classList.add(
            "vendido"
        );

        boton.disabled =
        true;

    }

    else if (
        asiento.estado ===
        "utilizado"
    ) {

        boton.classList.add(
            "utilizado"
        );

        boton.disabled =
        true;

    }

}

function seleccionarAsiento(
    asiento,
    boton
) {

    if (
        asiento.estado !==
        "disponible"
    ) return;

    const existe =
    seleccionados.find(
        item =>
        Number(item.id) ===
        Number(asiento.id)
    );

    if (existe) {

        seleccionados =
        seleccionados.filter(
            item =>
            Number(item.id) !==
            Number(asiento.id)
        );

        boton.classList.remove(
            "seleccionado"
        );

    }

    else {

        seleccionados.push(
            asiento
        );

        boton.classList.add(
            "seleccionado"
        );

    }

    actualizarResumen();

}

function actualizarResumen() {

    const cantidad =
    seleccionados.length;

    const total =
    cantidad *
    Number(
        evento.precio_asiento
    );

    document
    .getElementById("cantidad")
    .textContent =
    cantidad;

    document
    .getElementById("total")
    .textContent =
    formatoLempiras(total);

    if (
        cantidad === 0
    ) {

        document
        .getElementById("seleccion")
        .textContent =
        "Ninguno";

        return;

    }

    document
    .getElementById("seleccion")
    .textContent =
    seleccionados
    .map(
        asiento => {

            const mesa =
            mesas.find(
                item =>
                Number(item.id) ===
                Number(asiento.mesa_id)
            );

            return (
                "Mesa " +
                mesa.numero +
                " - Asiento " +
                asiento.numero
            );

        }
    )
    .join(" | ");

}

function abrirFormulario() {

    if (
        seleccionados.length ===
        0
    ) {

        alert(
            "Selecciona al menos un asiento."
        );

        return;
    }

    const total =
    seleccionados.length *
    Number(
        evento.precio_asiento
    );

    document
    .getElementById(
        "resumenModal"
    )
    .innerHTML = `

        <strong>
            ${seleccionados.length}
            boleto(s)
        </strong>

        <br>

        Precio unitario:
        ${formatoLempiras(
            evento.precio_asiento
        )}

        <br><br>

        <strong>
            TOTAL:
            ${formatoLempiras(total)}
        </strong>

    `;

    document
    .getElementById("modal")
    .style.display =
    "block";

}

function cerrarFormulario() {

    document
    .getElementById("modal")
    .style.display =
    "none";

}

async function confirmarReserva() {

    const nombre =
    document
    .getElementById("nombre")
    .value.trim();

    const telefono =
    document
    .getElementById("telefono")
    .value.trim();

    const correo =
    document
    .getElementById("correo")
    .value.trim();

    const mensaje =
    document
    .getElementById(
        "mensajeError"
    );

    mensaje.innerHTML = "";

    if (
        !nombre ||
        !telefono ||
        !correo
    ) {

        mensaje.innerHTML = `
            <div class="error">
                Completa todos los campos.
            </div>
        `;

        return;
    }

    const boton =
    document.querySelector(
        ".boton-confirmar"
    );

    boton.disabled =
    true;

    boton.textContent =
    "Procesando...";

    const cantidad =
    seleccionados.length;

    const total =
    cantidad *
    Number(
        evento.precio_asiento
    );

    try {

        const ids =
        seleccionados.map(
            asiento =>
            asiento.id
        );

        const resultado =
        await db.rpc(
            "crear_reserva",
            {

                p_nombre_cliente:
                nombre,

                p_telefono:
                telefono,

                p_email:
                correo,

                p_asientos:
                ids

            }
        );

        if (resultado.error)
            throw resultado.error;

        const datos =
        resultado.data;

        /*
        IMPORTANTE:
        Asignamos el evento a la reserva.
        */

        const actualizarReserva =
        await db
        .from("reservas")
        .update({
            evento_id:
            evento.id
        })
        .eq(
            "id",
            datos.reserva_id
        );

        /*
        Si RLS impide este UPDATE,
        la reserva igualmente existe.
        Luego mejoraremos crear_reserva
        para guardar evento_id directamente.
        */

        if (
            actualizarReserva.error
        ) {

            console.warn(
                actualizarReserva.error
            );

        }

        const resultadoBoletos =
        await db.rpc(
            "generar_boletos",
            {
                p_reserva_id:
                datos.reserva_id
            }
        );

        if (
            resultadoBoletos.error
        ) {

            throw resultadoBoletos.error;

        }

        const boletos =
        resultadoBoletos.data;

        let htmlBoletos = "";

        boletos.forEach(
            (boleto,index) => {

            const asiento =
            asientos.find(
                item =>
                Number(item.id) ===
                Number(
                    boleto.o_asiento_id
                )
            );

            const mesa =
            mesas.find(
                item =>
                Number(item.id) ===
                Number(
                    asiento.mesa_id
                )
            );

            htmlBoletos += `

                <div class="boleto">

                    <h3>
                        Mesa ${mesa.numero}
                        —
                        Asiento ${asiento.numero}
                    </h3>

                    <div
                    id="qr-${index}"
                    class="qr">
                    </div>

                    <p>
                        Valor:
                        ${formatoLempiras(
                            evento.precio_asiento
                        )}
                    </p>

                </div>

            `;

        });

        document
        .getElementById(
            "modalContenido"
        )
        .innerHTML = `

            <h2>
                ✅ Reserva confirmada
            </h2>

            <div class="codigo">
                ${datos.codigo_reserva}
            </div>

            <p>
                ${cantidad} boleto(s)
            </p>

            <h3>
                TOTAL:
                ${formatoLempiras(total)}
            </h3>

            ${htmlBoletos}

            <button
            class="boton"
            onclick="location.reload()">

                FINALIZAR

            </button>

        `;

        boletos.forEach(
            (boleto,index) => {

            new QRCode(
                document
                .getElementById(
                    `qr-${index}`
                ),
                {
                    text:
                    boleto.o_token,
                    width:
                    220,
                    height:
                    220
                }
            );

        });

    }

    catch(error) {

        console.error(error);

        mensaje.innerHTML = `

            <div class="error">
                No fue posible realizar la reserva.
            </div>

        `;

        boton.disabled =
        false;

        boton.textContent =
        "CONFIRMAR RESERVA";

    }

}

cargarEvento();

</script>

</body>

</html>
