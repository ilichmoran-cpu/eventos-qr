<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Evento</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}


/* ==========================================
   HEADER
========================================== */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 40px 20px;
}

header h1 {
    margin: 0 0 10px;
    font-size: 36px;
}

header p {
    margin: 6px;
}


/* ==========================================
   CONTENEDOR
========================================== */

.container {
    max-width: 1500px;
    margin: 30px auto;
    padding: 0 15px 230px;
}


/* ==========================================
   LEYENDA
========================================== */

.leyenda {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
    flex-wrap: wrap;
}

.leyenda-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.circulo {
    width: 18px;
    height: 18px;
    border-radius: 50%;
}

.verde {
    background: #2ecc71;
}

.amarillo {
    background: #f1c40f;
}

.rojo {
    background: #e74c3c;
}

.estado {
    text-align: center;
    font-weight: bold;
    margin: 20px;
}


/* ==========================================
   AVISO MAPA
========================================== */

.aviso-scroll {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin: 12px 0;
}


/* ==========================================
   CONTROLES ZOOM
========================================== */

.controles-mapa {

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    margin: 15px 0;

    position: sticky;
    top: 8px;

    z-index: 80;
}

.boton-zoom {

    width: 46px;
    height: 46px;

    border: none;
    border-radius: 10px;

    background: #111;
    color: white;

    font-size: 27px;
    font-weight: bold;

    cursor: pointer;
}

.boton-zoom:hover {
    background: #333;
}

.nivel-zoom {

    min-width: 68px;
    height: 46px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-weight: bold;
}

.boton-ajustar {

    height: 46px;

    padding: 0 16px;

    border: none;

    border-radius: 10px;

    background: #333;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.boton-ajustar:hover {
    background: #555;
}


/* ==========================================
   CONTENEDOR DEL MAPA
========================================== */

.mapa-scroll {

    width: 100%;

    overflow: auto;

    -webkit-overflow-scrolling: touch;

    background: #eaeaea;

    border-radius: 15px;

    padding: 15px;

    min-height: 400px;
}


/*
Este contenedor cambia de tamaño
según el nivel de zoom.
*/

#mapaEscala {

    position: relative;

    transform-origin: top left;
}


/* ==========================================
   MAPA
========================================== */

.mapa {

    width: 1380px;

    transform-origin: top left;

    transition:
        transform .18s ease;
}


/* ==========================================
   ESCENARIO
========================================== */

.escenario {

    width: 75%;

    margin: 0 auto 35px;

    background: #111;

    color: white;

    padding: 20px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    letter-spacing: 3px;

    font-size: 20px;
}


/* ==========================================
   MESAS

   SIEMPRE 5 MESAS POR FILA
========================================== */

.mesas {

    display: grid;

    grid-template-columns:
        repeat(5, 250px);

    gap: 28px;

    justify-content: center;

    align-items: start;
}


/* ==========================================
   TARJETA DE MESA
========================================== */

.mesa {

    background: white;

    border-radius: 15px;

    padding: 18px 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    text-align: center;
}

.mesa h3 {
    margin-top: 0;
    margin-bottom: 15px;
}


/* ==========================================
   MESA VERTICAL

      1     6
      2     7
      3 M   8
      4     9
      5    10
========================================== */

.distribucion-mesa {

    display: grid;

    grid-template-columns:
        44px
        105px
        44px;

    grid-template-rows:
        repeat(5, 48px);

    column-gap: 10px;

    row-gap: 7px;

    justify-content: center;

    align-items: center;
}


/* ==========================================
   RECTÁNGULO CENTRAL
========================================== */

.rectangulo-mesa {

    grid-column: 2;

    grid-row: 1 / 6;

    height: 100%;

    min-height: 268px;

    background: #111;

    color: white;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    writing-mode: vertical-rl;

    transform: rotate(180deg);

    font-weight: bold;

    letter-spacing: 1px;
}


/* ==========================================
   ASIENTOS
========================================== */

.asiento {

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: #2ecc71;

    color: white;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    transition:
        transform .15s,
        background .15s;
}

.asiento:hover {

    transform:
        scale(1.08);
}


.asiento-izquierda {
    grid-column: 1;
}

.asiento-derecha {
    grid-column: 3;
}


.fila-1 {
    grid-row: 1;
}

.fila-2 {
    grid-row: 2;
}

.fila-3 {
    grid-row: 3;
}

.fila-4 {
    grid-row: 4;
}

.fila-5 {
    grid-row: 5;
}


/* ==========================================
   ESTADOS
========================================== */

.asiento.seleccionado {

    background: #f1c40f;

    color: #111;

    transform:
        scale(1.08);
}

.asiento.reservado {

    background: #e74c3c;

    cursor: not-allowed;
}

.asiento.vendido {

    background: #8e44ad;

    cursor: not-allowed;
}

.asiento.utilizado {

    background: #555;

    cursor: not-allowed;
}


/* ==========================================
   RESUMEN FIJO INFERIOR
========================================== */

.resumen {

    position: fixed;

    bottom: 0;

    left: 0;
    right: 0;

    background: white;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.15);

    padding: 13px 15px;

    text-align: center;

    z-index: 100;
}

#seleccion {

    font-size: 13px;

    max-height: 45px;

    overflow-y: auto;

    margin: 6px auto;

    max-width: 900px;
}

.info-precio {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;

    flex-wrap: wrap;

    margin: 6px 0;
}

.total {

    font-size: 22px;

    font-weight: bold;
}


/* ==========================================
   BOTÓN
========================================== */

.boton {

    border: none;

    background: #111;

    color: white;

    padding: 13px 28px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;
}

.boton:hover {
    background: #333;
}


/* ==========================================
   MODAL
========================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.65);

    z-index: 500;

    overflow-y: auto;

    padding: 20px;
}

.modal-contenido {

    background: white;

    max-width: 520px;

    margin: 30px auto;

    padding: 28px;

    border-radius: 15px;
}

.campo {
    margin-bottom: 16px;
}

.campo label {

    display: block;

    font-weight: bold;

    margin-bottom: 6px;
}

.campo input {

    width: 100%;

    padding: 12px;

    border:
        1px solid #ccc;

    border-radius: 7px;

    font-size: 16px;
}

.botones-modal {

    display: flex;

    gap: 10px;
}

.boton-cancelar {

    flex: 1;

    padding: 13px;

    border: none;

    border-radius: 7px;

    cursor: pointer;
}

.boton-confirmar {

    flex: 2;

    padding: 13px;

    border: none;

    border-radius: 7px;

    background: #111;

    color: white;

    cursor: pointer;
}

.resumen-compra {

    background: #f5f5f5;

    padding: 15px;

    border-radius: 10px;

    line-height: 1.7;

    margin-bottom: 20px;
}


/* ==========================================
   BOLETOS QR
========================================== */

.boleto {

    background: #f5f5f5;

    padding: 20px;

    border-radius: 12px;

    margin: 18px 0;

    text-align: center;
}

.qr {

    display: flex;

    justify-content: center;

    margin: 15px auto;
}

.codigo {

    background: #eee;

    padding: 14px;

    border-radius: 8px;

    font-weight: bold;

    margin: 15px 0;
}

.error {

    background: #ffe5e5;

    color: #b00000;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 15px;
}


/* ==========================================
   MÓVIL
========================================== */

@media(max-width:600px) {

    header {

        padding:
            30px
            15px;
    }

    header h1 {

        font-size: 25px;
    }

    header p {

        font-size: 14px;
    }

    .container {

        margin-top: 15px;

        padding:
            0
            8px
            235px;
    }

    .leyenda {

        gap: 12px;

        margin:
            15px
            5px;

        font-size: 12px;
    }

    .controles-mapa {

        margin:
            10px
            0;

        top: 5px;
    }

    .boton-zoom {

        width: 42px;

        height: 42px;
    }

    .nivel-zoom {

        height: 42px;

        min-width: 62px;
    }

    .boton-ajustar {

        height: 42px;

        font-size: 12px;

        padding:
            0
            12px;
    }

    .mapa-scroll {

        padding: 7px;

        min-height: 320px;
    }

    /*
    MUY IMPORTANTE:

    La estructura NO cambia.

    Siempre conserva 5 mesas
    por fila.
    */

    .mapa {

        width: 1380px;
    }

    .mesas {

        grid-template-columns:
            repeat(5, 250px);
    }

    .resumen {

        padding:
            10px
            8px
            12px;
    }

    #seleccion {

        font-size: 11px;

        max-height: 38px;
    }

    .info-precio {

        gap: 12px;

        font-size: 13px;
    }

    .total {

        font-size: 19px;
    }

    .boton {

        padding:
            11px
            25px;
    }

    .modal {

        padding: 10px;
    }

    .modal-contenido {

        padding:
            22px
            18px;

        margin:
            20px auto;
    }

}

</style>

</head>


<body>

<script>


/* =====================================================
   SUPABASE
===================================================== */


const SUPABASE_URL =
"https://ysismkibffhzouxacaxv.supabase.co";




const SUPABASE_KEY =
"sb_publishable_zDHgY0bQDhtD60u8B3xQlA_F8w0Lv5L";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */


let evento = null;

let mesas = [];

let asientos = [];

let seleccionados = [];


/* =====================================================
   VARIABLES DEL ZOOM
===================================================== */


let zoomMapa = 1;


const ZOOM_MINIMO =
0.25;


const ZOOM_MAXIMO =
1.30;


const PASO_ZOOM =
0.10;


/* =====================================================
   FORMATO LEMPIRAS
===================================================== */


function formatoLempiras(
    valor
) {

    return (
        "L " +
        Number(valor)
        .toLocaleString(
            "es-HN",
            {
                minimumFractionDigits:
                2,

                maximumFractionDigits:
                2
            }
        )
    );

}


/* =====================================================
   OBTENER ID DEL EVENTO
===================================================== */


function obtenerEventoId() {

    const parametros =
    new URLSearchParams(
        window.location.search
    );


    return Number(
        parametros.get("id")
    );

}


/* =====================================================
   CARGAR EVENTO
===================================================== */


async function cargarEvento() {

    try {


        const eventoId =
        obtenerEventoId();


        if (!eventoId) {

            throw new Error(
                "Evento no válido"
            );

        }


        /* EVENTO */


        const resultadoEvento =
        await db
        .from("eventos")
        .select("*")
        .eq(
            "id",
            eventoId
        )
        .single();


        if (
            resultadoEvento.error
        ) {

            throw resultadoEvento.error;

        }


        evento =
        resultadoEvento.data;


        /* INFORMACIÓN */


        document
        .getElementById(
            "nombreEvento"
        )
        .textContent =
        evento.nombre;


        document
        .getElementById(
            "fechaEvento"
        )
        .textContent =
        "📅 " +
        new Date(
            evento.fecha
        )
        .toLocaleDateString(
            "es-HN",
            {
                day:
                "2-digit",

                month:
                "long",

                year:
                "numeric"
            }
        );


        document
        .getElementById(
            "lugarEvento"
        )
        .textContent =
        "📍 " +
        evento.lugar;


        document
        .getElementById(
            "precioEvento"
        )
        .textContent =
        "🎟️ " +
        formatoLempiras(
            evento.precio_asiento
        ) +
        " por asiento";


        document
        .getElementById(
            "precioResumen"
        )
        .textContent =
        formatoLempiras(
            evento.precio_asiento
        );


        /* MESAS */


        const resultadoMesas =
        await db
        .from("mesas")
        .select("*")
        .eq(
            "evento_id",
            eventoId
        )
        .order("numero");


        if (
            resultadoMesas.error
        ) {

            throw resultadoMesas.error;

        }


        mesas =
        resultadoMesas.data;


        if (
            mesas.length === 0
        ) {

            throw new Error(
                "Este evento no tiene mesas."
            );

        }


        /* IDs MESAS */


        const idsMesas =
        mesas.map(
            mesa =>
            mesa.id
        );


        /* ASIENTOS */


        const resultadoAsientos =
        await db
        .from("asientos")
        .select("*")
        .in(
            "mesa_id",
            idsMesas
        )
        .order("id");


        if (
            resultadoAsientos.error
        ) {

            throw resultadoAsientos.error;

        }


        asientos =
        resultadoAsientos.data;


        /* MOSTRAR */


        mostrarMesas();


        document
        .getElementById(
            "estado"
        )
        .textContent =
        "Selecciona tus asientos";


        /*
        Una vez creado el mapa,
        calculamos automáticamente
        el mejor zoom.
        */


        setTimeout(
            ajustarMapa,
            120
        );


    }

    catch(error) {


        console.error(
            error
        );


        document
        .getElementById(
            "estado"
        )
        .textContent =
        "No fue posible cargar el evento.";

    }

}


/* =====================================================
   MOSTRAR MESAS
===================================================== */


function mostrarMesas() {


    const contenedor =
    document
    .getElementById(
        "mesas"
    );


    contenedor.innerHTML =
    "";


    mesas.forEach(
        mesa => {


        const mesaDiv =
        document.createElement(
            "div"
        );


        mesaDiv.className =
        "mesa";


        const titulo =
        document.createElement(
            "h3"
        );


        titulo.textContent =
        "MESA " +
        mesa.numero;


        mesaDiv.appendChild(
            titulo
        );


        /* DISTRIBUCIÓN */


        const distribucion =
        document.createElement(
            "div"
        );


        distribucion.className =
        "distribucion-mesa";


        /* RECTÁNGULO */


        const rectangulo =
        document.createElement(
            "div"
        );


        rectangulo.className =
        "rectangulo-mesa";


        rectangulo.textContent =
        "MESA " +
        mesa.numero;


        distribucion.appendChild(
            rectangulo
        );


        /* ASIENTOS DE ESTA MESA */


        const asientosMesa =
        asientos
        .filter(
            asiento =>
            Number(
                asiento.mesa_id
            ) ===
            Number(
                mesa.id
            )
        )
        .sort(
            (a,b) =>
            Number(a.numero) -
            Number(b.numero)
        );


        asientosMesa.forEach(
            asiento => {


            const boton =
            document.createElement(
                "button"
            );


            boton.className =
            "asiento";


            boton.textContent =
            asiento.numero;


            /*
            1 AL 5
            LADO IZQUIERDO
            */


            if (
                Number(
                    asiento.numero
                ) <= 5
            ) {


                boton.classList.add(
                    "asiento-izquierda"
                );


                boton.classList.add(
                    `fila-${asiento.numero}`
                );

            }


            /*
            6 AL 10
            LADO DERECHO
            */


            else {


                boton.classList.add(
                    "asiento-derecha"
                );


                const fila =
                Number(
                    asiento.numero
                ) - 5;


                boton.classList.add(
                    `fila-${fila}`
                );

            }


            actualizarEstadoVisual(
                boton,
                asiento
            );


            boton.onclick =
            () =>
            seleccionarAsiento(
                asiento,
                boton
            );


            distribucion.appendChild(
                boton
            );

        });


        mesaDiv.appendChild(
            distribucion
        );


        contenedor.appendChild(
            mesaDiv
        );

    });

}


/* =====================================================
   ESTADO VISUAL
===================================================== */


function actualizarEstadoVisual(
    boton,
    asiento
) {


    boton.classList.remove(
        "reservado",
        "vendido",
        "utilizado"
    );


    if (
        asiento.estado ===
        "reservado"
    ) {


        boton.classList.add(
            "reservado"
        );


        boton.disabled =
        true;

    }


    else if (
        asiento.estado ===
        "vendido"
    ) {


        boton.classList.add(
            "vendido"
        );


        boton.disabled =
        true;

    }


    else if (
        asiento.estado ===
        "utilizado"
    ) {


        boton.classList.add(
            "utilizado"
        );


        boton.disabled =
        true;

    }


    else {


        boton.disabled =
        false;

    }

}


/* =====================================================
   SELECCIONAR ASIENTO
===================================================== */


function seleccionarAsiento(
    asiento,
    boton
) {


    if (
        asiento.estado !==
        "disponible"
    ) {

        return;

    }


    const existe =
    seleccionados.find(
        item =>
        Number(item.id) ===
        Number(asiento.id)
    );


    if (existe) {


        seleccionados =
        seleccionados.filter(
            item =>
            Number(item.id) !==
            Number(asiento.id)
        );


        boton.classList.remove(
            "seleccionado"
        );

    }


    else {


        seleccionados.push(
            asiento
        );


        boton.classList.add(
            "seleccionado"
        );

    }


    actualizarResumen();

}


/* =====================================================
   ACTUALIZAR RESUMEN
===================================================== */


function actualizarResumen() {


    const cantidad =
    seleccionados.length;


    const total =
    cantidad *
    Number(
        evento.precio_asiento
    );


    document
    .getElementById(
        "cantidad"
    )
    .textContent =
    cantidad;


    document
    .getElementById(
        "total"
    )
    .textContent =
    formatoLempiras(
        total
    );


    if (
        cantidad ===
        0
    ) {


        document
        .getElementById(
            "seleccion"
        )
        .textContent =
        "Ninguno";


        return;

    }


    document
    .getElementById(
        "seleccion"
    )
    .textContent =
    seleccionados
    .map(
        asiento => {


            const mesa =
            mesas.find(
                item =>
                Number(item.id) ===
                Number(
                    asiento.mesa_id
                )
            );


            return (
                "Mesa " +
                mesa.numero +
                " - Asiento " +
                asiento.numero
            );

        }
    )
    .join(" | ");

}


/* =====================================================
   ABRIR FORMULARIO
===================================================== */


function abrirFormulario() {


    if (
        seleccionados.length ===
        0
    ) {


        alert(
            "Selecciona al menos un asiento."
        );


        return;

    }


    const cantidad =
    seleccionados.length;


    const total =
    cantidad *
    Number(
        evento.precio_asiento
    );


    const detalle =
    seleccionados
    .map(
        asiento => {


            const mesa =
            mesas.find(
                item =>
                Number(item.id) ===
                Number(
                    asiento.mesa_id
                )
            );


            return (
                "Mesa " +
                mesa.numero +
                " — Asiento " +
                asiento.numero
            );

        }
    );


    document
    .getElementById(
        "resumenModal"
    )
    .innerHTML = `


        <strong>
            Resumen de la reserva
        </strong>


        <br><br>


        ${detalle.join("<br>")}


        <br><br>


        Cantidad:

        <strong>
            ${cantidad}
        </strong>


        <br>


        Precio por asiento:

        <strong>
            ${formatoLempiras(
                evento.precio_asiento
            )}
        </strong>


        <br><br>


        <strong>

            TOTAL:

            ${formatoLempiras(
                total
            )}

        </strong>

    `;


    document
    .getElementById(
        "mensajeError"
    )
    .innerHTML =
    "";


    document
    .getElementById(
        "modal"
    )
    .style.display =
    "block";

}


/* =====================================================
   CERRAR FORMULARIO
===================================================== */


function cerrarFormulario() {


    document
    .getElementById(
        "modal"
    )
    .style.display =
    "none";

}


/* =====================================================
   CONFIRMAR RESERVA
===================================================== */


async function confirmarReserva() {


    const nombre =
    document
    .getElementById(
        "nombre"
    )
    .value
    .trim();


    const telefono =
    document
    .getElementById(
        "telefono"
    )
    .value
    .trim();


    const correo =
    document
    .getElementById(
        "correo"
    )
    .value
    .trim();


    const mensaje =
    document
    .getElementById(
        "mensajeError"
    );


    mensaje.innerHTML =
    "";


    if (
        !nombre ||
        !telefono ||
        !correo
    ) {


        mensaje.innerHTML = `

            <div class="error">

                Completa todos
                los campos.

            </div>

        `;


        return;

    }


    const boton =
    document.querySelector(
        ".boton-confirmar"
    );


    boton.disabled =
    true;


    boton.textContent =
    "Procesando...";


    const cantidad =
    seleccionados.length;


    const total =
    cantidad *
    Number(
        evento.precio_asiento
    );


    try {


        const ids =
        seleccionados.map(
            asiento =>
            asiento.id
        );


        /*
        CREAR RESERVA
        */


        const resultado =
        await db.rpc(
            "crear_reserva",
            {


                p_nombre_cliente:
                nombre,


                p_telefono:
                telefono,


                p_email:
                correo,


                p_asientos:
                ids


            }
        );


        if (
            resultado.error
        ) {


            throw resultado.error;

        }


        const datos =
        resultado.data;


        /*
        ASIGNAR EVENTO
        */


        const actualizarReserva =
        await db
        .from(
            "reservas"
        )
        .update(
            {
                evento_id:
                evento.id
            }
        )
        .eq(
            "id",
            datos.reserva_id
        );


        if (
            actualizarReserva.error
        ) {


            console.warn(
                "No se pudo actualizar evento_id:",
                actualizarReserva.error
            );

        }


        /*
        GENERAR BOLETOS
        */


        const resultadoBoletos =
        await db.rpc(
            "generar_boletos",
            {

                p_reserva_id:
                datos.reserva_id

            }
        );


        if (
            resultadoBoletos.error
        ) {


            throw resultadoBoletos.error;

        }


        const boletos =
        resultadoBoletos.data;


        /*
        CREAR HTML DE LOS BOLETOS
        */


        let htmlBoletos =
        "";


        boletos.forEach(
            (boleto,index) => {


            const asiento =
            asientos.find(
                item =>
                Number(item.id) ===
                Number(
                    boleto.o_asiento_id
                )
            );


            if (!asiento) {

                return;

            }


            const mesa =
            mesas.find(
                item =>
                Number(item.id) ===
                Number(
                    asiento.mesa_id
                )
            );


            if (!mesa) {

                return;

            }


            htmlBoletos += `


                <div class="boleto">


                    <h3>

                        Mesa
                        ${mesa.numero}

                        —

                        Asiento
                        ${asiento.numero}

                    </h3>


                    <div
                    id="qr-${index}"
                    class="qr">

                    </div>


                    <p>

                        Valor:

                        <strong>

                            ${formatoLempiras(
                                evento.precio_asiento
                            )}

                        </strong>

                    </p>


                    <p>

                        Presenta este QR
                        al ingresar.

                    </p>


                </div>


            `;

        });


        /*
        MOSTRAR CONFIRMACIÓN
        */


        document
        .getElementById(
            "modalContenido"
        )
        .innerHTML = `


            <div style="text-align:center">


                <h2>

                    ✅ Reserva confirmada

                </h2>


                <p>

                    Tu reserva fue
                    registrada correctamente.

                </p>


                <div class="codigo">

                    ${datos.codigo_reserva}

                </div>


                <p>

                    ${cantidad}

                    ${
                        cantidad === 1
                        ? "boleto"
                        : "boletos"
                    }

                </p>


                <h3>

                    TOTAL:

                    ${formatoLempiras(
                        total
                    )}

                </h3>


                ${htmlBoletos}


                <button
                class="boton"
                onclick="location.reload()">

                    FINALIZAR

                </button>


            </div>


        `;


        /*
        GENERAR QR
        */


        boletos.forEach(
            (boleto,index) => {


            new QRCode(
                document
                .getElementById(
                    `qr-${index}`
                ),
                {


                    text:
                    boleto.o_token,


                    width:
                    220,


                    height:
                    220


                }
            );

        });


    }


    catch(error) {


        console.error(
            error
        );


        mensaje.innerHTML = `

            <div class="error">

                No fue posible
                realizar la reserva.

                <br><br>

                Es posible que uno
                de los asientos ya
                no esté disponible.

            </div>

        `;


        boton.disabled =
        false;


        boton.textContent =
        "CONFIRMAR RESERVA";

    }

}


/* =====================================================
   APLICAR ZOOM
===================================================== */


function aplicarZoom() {


    const mapa =
    document.getElementById(
        "mapa"
    );


    const escala =
    document.getElementById(
        "mapaEscala"
    );


    if (
        !mapa ||
        !escala
    ) {

        return;

    }


    mapa.style.transform =
    `scale(${zoomMapa})`;


    /*
    Ajustar área ocupada
    después de escalar.
    */


    escala.style.width =
    (
        mapa.offsetWidth *
        zoomMapa
    ) +
    "px";


    escala.style.height =
    (
        mapa.offsetHeight *
        zoomMapa
    ) +
    "px";


    document
    .getElementById(
        "nivelZoom"
    )
    .textContent =
    Math.round(
        zoomMapa *
        100
    ) +
    "%";

}


/* =====================================================
   ACERCAR
===================================================== */


function acercarMapa() {


    zoomMapa +=
    PASO_ZOOM;


    if (
        zoomMapa >
        ZOOM_MAXIMO
    ) {


        zoomMapa =
        ZOOM_MAXIMO;

    }


    aplicarZoom();

}


/* =====================================================
   ALEJAR
===================================================== */


function alejarMapa() {


    zoomMapa -=
    PASO_ZOOM;


    if (
        zoomMapa <
        ZOOM_MINIMO
    ) {


        zoomMapa =
        ZOOM_MINIMO;

    }


    aplicarZoom();

}


/* =====================================================
   AJUSTAR MAPA A LA PANTALLA
===================================================== */


function ajustarMapa() {


    const mapa =
    document.getElementById(
        "mapa"
    );


    const contenedor =
    document.getElementById(
        "mapaScroll"
    );


    if (
        !mapa ||
        !contenedor
    ) {

        return;

    }


    /*
    En escritorio dejamos
    zoom normal.
    */


    if (
        window.innerWidth >
        700
    ) {


        zoomMapa =
        1;

    }


    else {


        /*
        En teléfono calculamos
        automáticamente cuánto
        debemos reducir el mapa
        para que entren las
        cinco mesas de una fila.
        */


        const anchoDisponible =
        contenedor.clientWidth -
        16;


        const anchoMapa =
        mapa.offsetWidth;


        zoomMapa =
        anchoDisponible /
        anchoMapa;


        /*
        Limitar el resultado.
        */


        if (
            zoomMapa <
            ZOOM_MINIMO
        ) {


            zoomMapa =
            ZOOM_MINIMO;

        }


        if (
            zoomMapa >
            0.55
        ) {


            zoomMapa =
            0.55;

        }

    }


    aplicarZoom();


    /*
    Volver al inicio del mapa.
    */


    contenedor.scrollTo({
        left:
        0,

        top:
        0,

        behavior:
        "smooth"
    });

}


/* =====================================================
   AJUSTAR SI CAMBIA ORIENTACIÓN
===================================================== */


window.addEventListener(
    "resize",
    () => {


        clearTimeout(
            window.temporizadorResize
        );


        window.temporizadorResize =
        setTimeout(
            ajustarMapa,
            250
        );

    }
);


/* =====================================================
   INICIAR
===================================================== */


cargarEvento();


</script>
