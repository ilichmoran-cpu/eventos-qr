<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Próximos Eventos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 45px 20px;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    margin-top: 10px;
    color: #ccc;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px 50px;
}

.titulo {
    text-align: center;
    margin-bottom: 30px;
}

.eventos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
}

.evento {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    cursor: pointer;
    transition: .2s;
}

.evento:hover {
    transform: translateY(-4px);
}

.flyer {
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
}

.flyer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.info {
    padding: 20px;
}

.info h2 {
    margin: 0 0 12px;
    font-size: 22px;
}

.info p {
    margin: 6px 0;
}

.precio {
    font-size: 20px;
    font-weight: bold;
    margin-top: 12px;
}

.boton {
    margin-top: 16px;
    width: 100%;
    padding: 14px;
    background: #111;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.estado {
    text-align: center;
    padding: 30px;
}

@media(max-width:600px) {

    header h1 {
        font-size: 29px;
    }

    .eventos {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<h1>PRÓXIMOS EVENTOS</h1>

<p>Selecciona el evento que deseas reservar</p>

</header>

<div class="container">

<div class="titulo">

<h2>Eventos disponibles</h2>

</div>

<div id="estado"
class="estado">

Cargando eventos...

</div>

<div id="eventos"
class="eventos">

</div>

</div>

<script>

const SUPABASE_URL =
"https://ysismkibffhzouxacaxv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zDHgY0bQDhtD60u8B3xQlA_F8w0Lv5L";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function formatoLempiras(valor) {

    return "L " +
    Number(valor).toLocaleString(
        "es-HN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}

function formatearFecha(fecha) {

    if (!fecha)
        return "";

    return new Date(fecha)
        .toLocaleDateString(
            "es-HN",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

}

async function cargarEventos() {

    try {

        const resultado =
        await db
        .from("eventos")
        .select("*")
        .eq("activo", true)
        .order("fecha");

        if (resultado.error)
            throw resultado.error;

        const eventos =
        resultado.data;

        const contenedor =
        document.getElementById(
            "eventos"
        );

        contenedor.innerHTML = "";

        eventos.forEach(evento => {

            const tarjeta =
            document.createElement("div");

            tarjeta.className =
            "evento";

            const flyer =
            evento.flyer_url
            ?
            `<img src="${evento.flyer_url}" alt="${evento.nombre}">`
            :
            `<span>FLYER DEL EVENTO</span>`;

            tarjeta.innerHTML = `

                <div class="flyer">
                    ${flyer}
                </div>

                <div class="info">

                    <h2>
                        ${evento.nombre}
                    </h2>

                    <p>
                        📅 ${formatearFecha(evento.fecha)}
                    </p>

                    <p>
                        📍 ${evento.lugar || ""}
                    </p>

                    <div class="precio">
                        Desde ${formatoLempiras(evento.precio_asiento)}
                    </div>

                    <button class="boton">
                        VER EVENTO
                    </button>

                </div>

            `;

            tarjeta.onclick =
            () => {

                window.location.href =
                `evento.html?id=${evento.id}`;

            };

            contenedor.appendChild(
                tarjeta
            );

        });

        document
        .getElementById("estado")
        .style.display =
        "none";

    }

    catch(error) {

        console.error(error);

        document
        .getElementById("estado")
        .textContent =
        "No fue posible cargar los eventos.";

    }

}

cargarEventos();

</script>

</body>

</html>
